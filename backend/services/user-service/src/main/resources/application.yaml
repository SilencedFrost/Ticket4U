# Database Configuration
spring:
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/Ticket4U-User}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Enable DevTools
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
      port: 35729

# Port
server:
  port: ${SERVER_PORT:8080}


application:
  # JWT
  security:
    jwt:
      private-key-path: keys/ec-private.pem
      public-key-path: keys/ec-public.pem
      key-id: auth-key-es256
      issuer: ticket4u

# Logging
logging:
  level:
    root: INFO