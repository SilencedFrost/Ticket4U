<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #dc3545;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Xin chào <span th:text="${userName}">User</span>,</h2>
        <p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu của bạn.</p>
        <p style="text-align: center; margin: 30px 0;">
            <a th:href="${resetUrl}" class="btn">Đặt lại mật khẩu</a>
        </p>
        <p>Link này sẽ hết hạn sau <strong th:text="${expireMinutes}">30</strong> phút.</p>
        <p>Nếu bạn không yêu cầu đặt lại mật khẩu, vui lòng bỏ qua email này.</p>
        <div class="footer">
            <p>&copy; 2026 Ticket4U. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
