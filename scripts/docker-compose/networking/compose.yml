name: ticket4u-networking

services:

  nginx:
    image: nginx:latest
    container_name: ticket4u_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - ticket4u-network

networks:
  ticket4u-network:
    external: true
