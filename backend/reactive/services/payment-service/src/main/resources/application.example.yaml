spring:
  datasource:
    url: ${DB_TICKET_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT}

application:
  security:
    cors:
      allowed-origins: ${FRONTEND_URL}
  payment:
    webhook-key: ${SEPAY_WEBHOOK_KEY}
    order-code-prefix: ${SEPAY_ORDER_CODE_PREFIX}
    sepay:
      bank-code: ${SEPAY_QR_BANK_CODE}
      account-number: ${SEPAY_QR_ACCOUNT_NUMBER}
      account-name: ${SEPAY_QR_ACCOUNT_NAME}
      template: ${SEPAY_QR_TEMPLATE}
  services:
    ticket:
      url: ${TICKET_SERVICE_URL}
      api-key: ${TICKET_INTERNAL_API_KEY}

logging:
  level:
    root: INFO
