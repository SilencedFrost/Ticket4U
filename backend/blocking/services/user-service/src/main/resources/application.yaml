# Database Configuration
spring:
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/Ticket4U-User}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Port
server:
  port: ${SERVER_PORT:8080}

application:
  security:
    # JWT
    jwt:
      private-key-path: keys/ec-private.pem
      public-key-path: keys/ec-public.pem
      key-id: auth-key-es256
      issuer: ticket4u
    # CORS
    cors:
      allowed-origins: ${FRONTEND_URL:https://localhost:3000}

# Logging
logging:
  level:
    root: INFO

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
