# Database Configuration
spring:
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/Ticket4U-Ticket}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Port
server:
  port: ${SERVER_PORT:8081}

application:
  security:
    # CORS
    cors:
      allowed-origins: ${FRONTEND_URL}
  internal:
    api-key: ${TICKET_INTERNAL_API_KEY:ticket-internal-dev-key}
    system-user-id: ${TICKET_SYSTEM_USER_ID:00000000-0000-0000-0000-000000000000}
  services:
    user: ${USER_SERVICE_URL:https://localhost:8080}

# Logging
logging:
  level:
    root: WARN
    com.ticket4u.service.impl: DEBUG
