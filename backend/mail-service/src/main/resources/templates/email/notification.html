<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông báo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
        }

        .title {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .content {
            margin: 20px 0;
            line-height: 1.6;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="title" th:text="${title}">Thông báo</h2>
        <div class="content" th:utext="${content}">
            Nội dung thông báo
        </div>
        <div class="footer">
            <p>&copy; 2026 Ticket4U. All rights reserved.</p>
        </div>
    </div>
</body>

</html>
