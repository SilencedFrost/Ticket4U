# Database Configuration
spring:
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/Ticket4U-Event}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        type:
          json_format_mapper: com.ticket4u.config.HibernateJackson3FormatMapper

# Port
server:
  port: ${SERVER_PORT:8083}

# Qdrant Configuration
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY:}
  timeout-seconds: ${QDRANT_TIMEOUT:5}

# AI Embedding Configuration
ai:
  embedding:
    api-url: ${AI_EMBEDDING_URL:http://localhost:8084/v1/embeddings}
    model-name: ${AI_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2}

application:
  security:
    # CORS
    cors:
      allowed-origins: ${FRONTEND_URL}
  services:
    user: ${USER_SERVICE_URL:https://localhost:8080}

# Logging
logging:
  level:
    root: INFO
